name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check committed bundle
        run: git diff --exit-code -- dist
      - name: Install the latest ppr-tool release through this Action
        uses: ./
        with:
          registry: https://packages.example.invalid
      - run: ppr-tool --help
